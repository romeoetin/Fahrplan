document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

abel style=\"font-size:12.5px;font-weight:800;color:var(--dim)\">{{ lCost }}<input key=\"{{ draftType }}\" type=\"number\" min=\"0\" step=\"1\" sc-camel-default-value=\"{{ draftCost }}\" sc-camel-on-input=\"{{ onDraftCost }}\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:4px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 12px;font-size:14px;outline:none\"><\u002Flabel>\n      <label style=\"font-size:12.5px;font-weight:800;color:var(--dim)\">{{ lNote }}<input type=\"text\" placeholder=\"{{ notePh }}\" sc-camel-on-input=\"{{ onDraftNote }}\" style=\"display:block;width:100%;box-sizing:border-box;margin-top:4px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 12px;font-size:14px;outline:none\"><\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;justify-content:flex-end;margin-top:18px\">\n      <button sc-camel-on-click=\"{{ closeModal }}\" style=\"padding:11px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:14px;cursor:pointer\">{{ cancelLab }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ saveLesson }}\" style=\"padding:11px 20px;border-radius:999px;border:none;background:var(--accent);color:#3A2A06;font-weight:800;font-size:14px;cursor:pointer\">{{ saveLab }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F2A93B&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#F2A93B&quot;,&quot;#2F9C8A&quot;,&quot;#E4704E&quot;],&quot;section&quot;:&quot;Theme&quot;},&quot;confetti&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;}}\">\nclass Component extends DCLogic {\n  state = { ready:false, manMode:\"watch\", signMode:\"learn\", signOpen:null, learnSub:\"phr\", modalOpen:false, authOpen:false, draftType:\"practice\", composerKey:0, composerOpen:false, toast:\"\", pyrOpen:null };\n  _toast(msg){ clearTimeout(this._tt); this.setState({toast:msg}); this._tt=setTimeout(()=>this.setState({toast:\"\"}), 2400); }\n  _goTab(tab){ this.mut(()=>{ this.app.tab=tab; }); window.scrollTo(0,0); }\n  componentDidMount(){\n    this._esc = (e)=>{ if(e.key===\"Escape\" && this.state.modalOpen) this.setState({modalOpen:false}); };\n    document.addEventListener(\"keydown\", this._esc);\n    this._boot();\n  }\n  componentWillUnmount(){ document.removeEventListener(\"keydown\", this._esc); clearTimeout(this._bt); }\n  componentDidUpdate(){ this._applyAccent(); }\n  _applyAccent(){ document.documentElement.style.setProperty(\"--accent\", this.props.accent ?? \"#F2A93B\"); }\n  _boot(){\n    const F = window.FAHRPLAN;\n    if(!F){ this._bt = setTimeout(()=>this._boot(), 40); return; }\n    this.F = F;\n    this.app = this._load();\n    F.setVeh(F.CLASSES[this.app.klasse].veh);\n    this.ux = { played:{}, flipped:{}, picks:{}, signPicks:{}, scenPicks:{}, repliesOpen:{}, editing:{} };\n    this.edrafts = {};\n    this.fdraft = { title:\"\", body:\"\", topic:\"general\" };\n    this.adraft = { name:\"\", email:\"\", pass:\"\" };\n    this.draft = { type:\"practice\", date:\"\", cost:0, note:\"\" };\n    this._applyAccent(); this._applyTheme();\n    this.setState({ ready:true });\n  }\n  _fresh(){\n    const F = this.F;\n    const s = { account:null, lang:\"en\", theme:(window.matchMedia && matchMedia(\"(prefers-color-scheme: dark)\").matches ? \"dark\" : \"light\"), klasse:\"B\", tab:\"journey\", convCountry:\"\", stages:{}, lessons:[], costsByClass:{}, assumeByClass:{}, reviewed:{}, quiz:{}, signQuiz:{}, scenQuiz:{}, forum:{ handle:\"\", posts:F.seedForumPosts(), sort:\"newest\", filter:\"all\", _seeded:true }, updatedAt:Date.now() };\n    F.STAGES.forEach(st=>{ s.stages[st.id]={status:\"todo\"}; });\n    return s;\n  }\n  _load(){\n    let s = null;\n    try{ s = JSON.parse(localStorage.getItem(\"fahrplan.v2\") || localStorage.getItem(\"fahrplan.v1\") || \"null\"); }catch(e){}\n    const F = this.F, base = this._fresh();\n    if(!s) return base;\n    s.stages = Object.assign(base.stages, s.stages||{});\n    s.lessons = s.lessons||[];\n    s.lang = s.lang===\"de\" ? \"de\" : \"en\";\n    s.klasse = F.CLASSES[s.klasse] ? s.klasse : \"B\";\n    s.tab = [\"journey\",\"man\",\"sign\",\"learn\",\"forum\"].indexOf(s.tab)>=0 ? s.tab : (s.tab===\"phr\"||s.tab===\"convert\" ? \"learn\" : \"journey\");\n    s.theme = s.theme===\"dark\" ? \"dark\" : s.theme===\"light\" ? \"light\" : (window.matchMedia && matchMedia(\"(prefers-color-scheme: dark)\").matches ? \"dark\" : \"light\");\n    s.costsByClass = s.costsByClass||{}; s.assumeByClass = s.assumeByClass||{};\n    s.reviewed = s.reviewed||{}; s.quiz = s.quiz||{}; s.signQuiz = s.signQuiz||{}; s.scenQuiz = s.scenQuiz||{};\n    s.convCountry = typeof s.convCountry===\"string\" ? s.convCountry : \"\";\n    s.forum = (s.forum && typeof s.forum===\"object\") ? s.forum : { handle:\"\", posts:[] };\n    s.forum.handle = typeof s.forum.handle===\"string\" ? s.forum.handle : \"\";\n    s.forum.posts = Array.isArray(s.forum.posts) ? s.forum.posts : [];\n    s.forum.sort = [\"newest\",\"oldest\",\"replies\"].indexOf(s.forum.sort)>=0 ? s.forum.sort : \"newest\";\n    s.forum.filter = [\"all\",\"en\",\"de\"].indexOf(s.forum.filter)>=0 ? s.forum.filter : \"all\";\n    s.forum.topic = [\"all\",\"general\",\"theory\",\"practical\",\"sehtest\",\"costs\",\"moto\"].indexOf(s.forum.topic)>=0 ? s.forum.topic : \"all\";\n    if(!s.forum._topicsSeeded){\n      s.forum.posts.forEach(p=>{\n        if(p.topic) return;\n        const ti=(p.title||\"\").toLowerCase();\n        if(ti.indexOf(\"theory test\")>=0) p.topic=\"theory\";\n        else if(ti.indexOf(\"prices\")>=0) p.topic=\"costs\";\n        else if(ti.indexOf(\"practical\")>=0 || ti.indexOf(\"nachtfahrt\")>=0) p.topic=\"practical\";\n      });\n      if(!s.forum.posts.some(p=>p.topic===\"sehtest\")){\n        const seed=this.F.seedForumPosts().find(p=>p.topic===\"sehtest\");\n        if(seed) s.forum.posts.push(seed);\n      }\n      s.forum._topicsSeeded=true;\n    }\n    Object.keys(s.costsByClass).forEach(k=>{ if(s.costsByClass[k] && s.costsByClass[k].sehtest===7) s.costsByClass[k].sehtest=0; });\n    if(!s.forum._seeded && s.forum.posts.length===0){ s.forum.posts = this.F.seedForumPosts(); s.forum._seeded = true; }\n    s.updatedAt = Number(s.updatedAt)||Date.now();\n    s.account = (s.account && typeof s.account===\"object\" && s.account.name) ? s.account : null;\n    if(s.account && s.account.signedIn===undefined){ s.account.signedIn=true; s.account.pass=s.account.pass||\"\"; }\n    s.emails = Array.isArray(s.emails) ? s.emails : [];\n    return s;\n  }\n  _save(){ this.app.updatedAt = Date.now(); try{ localStorage.setItem(\"fahrplan.v2\", JSON.stringify(this.app)); }catch(e){} }\n  mut(fn){ fn(); this._save(); this.forceUpdate(); }\n  _applyTheme(){\n    const de = document.documentElement;\n    de.setAttribute(\"data-theme\", this.app.theme);\n    de.lang = this.app.lang;\n  }\n  L(){ return this.F.T[this.app.lang]; }\n  CLSo(){ return this.F.CLASSES[this.app.klasse]; }\n  _ensure(k){ const a=this.app,F=this.F; if(!a.costsByClass[k]) a.costsByClass[k]=Object.assign({},F.CLASS_COSTS[k]); if(!a.assumeByClass[k]) a.assumeByClass[k]=Object.assign({},F.CLASS_ASSUME[k]); }\n  C(){ this._ensure(this.app.klasse); return this.app.costsByClass[this.app.klasse]; }\n  A(){ this._ensure(this.app.klasse); return this.app.assumeByClass[this.app.klasse]; }\n  costKeys(){ return Object.keys(this.F.CLASS_COSTS[this.app.klasse]); }\n  fmt(str,map){ return str.replace(/\\{(\\w+)\\}/g,(_,k)=>map[k]!=null?map[k]:\"{\"+k+\"}\"); }\n  eur(n){ return \"€\"+Math.round(n).toLocaleString(this.app.lang===\"de\"?\"de-DE\":\"en-GB\"); }\n  countLessons(t){ return this.app.lessons.filter(l=>l.type===t).length; }\n  sonderDone(){ return this.countLessons(\"ueberland\")>=5 && this.countLessons(\"autobahn\")>=4 && this.countLessons(\"nacht\")>=3; }\n  spent(){ let t=0; const cc=this.C(); this.F.STAGES.forEach(st=>{ if(this.app.stages[st.id].status===\"done\"&&cc[st.id]!=null) t+=Number(cc[st.id]||0); }); this.app.lessons.forEach(l=>{ t+=Number(l.cost||0); }); return t; }\n  estTotal(){ let t=0; const cc=this.C(),a=this.A(); this.costKeys().forEach(k=>{ t+=Number(cc[k]||0); }); t+=Number(a.expectedPractice||0)*Number(a.practicePrice||0); t+=12*Number(a.sonderPrice||0); return t; }\n  stepsDone(){ return this.F.STAGES.filter(st=>this.app.stages[st.id].status===\"done\").length; }\n  practicalSpent(){ let t=0; this.app.lessons.forEach(l=>{ t+=Number(l.cost||0); }); return t; }\n  stageText(st){ const c=this.L().stages[st.id], cls=this.CLSo(); return { sub:c.sub, what:this.fmt(c.what,{n:cls.theory,x:cls.theory-12,dur:cls.dur}), bring:c.bring, counterLabel:c.counterLabel||\"\" }; }\n  shuffleSeeded(arr,seed){ for(let i=arr.length-1;i>0;i--){ seed=(seed*9301+49297)%233280; const j=Math.floor(seed/233280*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }\n  timeAgo(ts){ const t=this.L(); const min=Math.floor((Date.now()-ts)/60000); if(min<1) return t.forumJustNow; if(min<60) return this.fmt(t.forumMinAgo,{n:min}); const hr=Math.floor(min/60); if(hr<24) return this.fmt(t.forumHourAgo,{n:hr}); return this.fmt(t.forumDayAgo,{n:Math.floor(hr/24)}); }\n  readiness(){\n    const F=this.F, st=this.app.stages, app=this.app;\n    const doneFrac = ids=>ids.filter(id=>st[id]&&st[id].status===\"done\").length/ids.length;\n    const admin = doneFrac([\"sehtest\",\"erstehilfe\",\"photo\",\"antrag\",\"anmelden\"]);\n    const theoryTotal = this.CLSo().theory, theoryN = (st.theorie&&st.theorie.count)||0;\n    const theoryFrac = Math.min(1, theoryN/theoryTotal);\n    const theoryExam = st.theoriepruefung&&st.theoriep rt zuerst? Die höhere Stufe schlägt immer alles darunter.\":\"Who goes first? A higher level always overrules everything below it.\";\n      vals.pyrNote = de2?\"Beispiel: Grün an der Ampel gilt auch, wenn dort ein Vorfahrt-gewähren-Schild steht — und der Winker des Polizisten schlägt sogar die Ampel.\":\"Example: a green light applies even if a give-way sign stands at the same junction — and an officer's hand signal beats even the light.\";\n      const lvls = [\n        { n:4, name:de2?\"Polizei\":\"Police\", desc:de2?\"Winkzeichen schlagen alles\":\"Hand signals beat everything\", w:52, col:\"var(--danger)\",\n          body:de2?\"Regelt ein Polizist den Verkehr, gelten NUR seine Zeichen — Ampeln und Schilder sind außer Kraft. Brust oder Rücken zu dir = Halt (wie Rot). Seite zu dir = du darfst fahren (wie Grün). Ein gehobener Arm = gleich kommt der Wechsel (wie Gelb).\"\n               :\"When an officer directs traffic, ONLY their signals count — lights and signs are suspended. Chest or back facing you = stop (like red). Side facing you = you may go (like green). One raised arm = about to change (like amber).\",\n          ex:de2?\"Der Polizist winkt dich durch, obwohl deine Ampel Rot zeigt → du fährst.\":\"The officer waves you through even though your light is red → you go.\" },\n        { n:3, name:de2?\"Lichtzeichen\":\"Traffic lights\", desc:de2?\"Ampeln schlagen Schilder\":\"Lights overrule signs\", w:67, col:\"var(--accent-deep)\",\n          body:de2?\"Eine funktionierende Ampel schlägt die Verkehrszeichen an derselben Kreuzung. Ist sie aus oder blinkt Gelb, fällst du eine Stufe zurück: Dann gelten wieder die Schilder — und ohne Schilder rechts vor links.\"\n               :\"A working traffic light overrules the road signs at the same junction. If it's off or flashing amber, you drop one level down: the signs apply again — and with no signs, right before left.\",\n          ex:de2?\"Grün + „Vorfahrt gewähren“-Schild darunter → Grün gilt, du fährst.\":\" ast(de?\"Alles gelöscht\":\"Everything deleted\");\n        },\n        hasEmails:(app.emails||[]).length>0, inboxLab:de?\"Postfach (simuliert)\":\"Inbox (simulated)\",\n        emails:(app.emails||[]).map(em=>({ key:em.id, subject:em.subject, body:em.body, meta:this.timeAgo(em.ts) })),\n        signOutLab:de?\"Abmelden\":\"Sign out\",\n        signOut:()=>{ this.setState({authOpen:false, authMode:\"signin\"}); this.mut(()=>{ this.app.account.signedIn=false; }); },\n      });\n    }\n    return vals;\n  }\n  async _createAccount(name, email, provider, pass){\n    const de=this.app.lang===\"de\";\n    this.adraft={name:\"\",email:\"\",pass:\"\"};\n    this.setState({authOpen:false});\n    let passSalt=\"\", passHash=\"\";\n    if(pass){ passSalt=this._salt(); passHash=await this._hash(pass, passSalt); }\n    this.mut(()=>{ this.app.account={ name, email, provider, passSalt, passHash, signedIn:true, createdAt:Date.now() }; this.app.forum.handle=name; });\n    this._sendEmail(\n      de?\"Willkommen bei Fahrplan, \"+name+\"! 🚗\":\"Welcome to Fahrplan, \"+name+\"! 🚗\",\n      de?\"Hallo \"+name+\",\\n\\nschön, dass du da bist! Dein Konto ist eingerichtet: Fortschritt, Kosten und Fahrstunden werden ab jetzt unter deinem Namen gespeichert, und im Forum kannst du posten.\\n\\nTipp zum Start: Öffne „Der Weg“ und tippe auf deinen nächsten Schritt.\\n\\nGute Fahrt!\\nDein Fahrplan-Team\"\n        :\"Hi \"+name+\",\\n\\ngreat to have you! Your account is set up: progress, costs and lessons are now saved under your name, and you can post in the forum.\\n\\nTip to get started: open the Journey tab and tap your next step.\\n\\nSafe driving!\\nYour Fahrplan team\");\n    this._toast((de?\"Willkommen, \":\"Welcome, \")+name+\"! 📧\");\n  }\n  _openModal(type){\n    const a=this.A();\n    this.draft={ type, date:new Date().toISOString().slice(0,10), cost:type===\"practice\"?a.practicePrice:a.sonderPrice, note:\"\" };\n    this.setState({ modalOpen:true, draftType:type });\n  }\n  _modalVals(t){\n    return { mTitle:t.mTitle, mSub:t.mSub, lType:t.lType, lDate:t.lDate, lCost:t.lCost, lNote:t.lNote, notePh:t.notePh,\n      typeOpts:[\"practice\",\"ueberland\",\"autobahn\",\"nacht\"].map(k=>({v:k,label:t.typeOpts[k]})),\n      draftType:this.state.draftType, draftDate:this.draft.date, draftCost:this.draft.cost,\n      onDraftType:(e)=>{ const v=e.target.value, a=this.A(); this.draft.type=v; this.draft.cost=v===\"practice\"?a.practicePrice:a.sonderPrice; this.setState({draftType:v}); },\n      onDraftDate:(e)=>{ this.draft.date=e.target.value; },\n      onDraftCost:(e)=>{ this.draft.cost=Number(e.target.value||0); },\n      onDraftNote:(e)=>{ this.draft.note=e.target.value; },\n      cancelLab:t.cancel, saveLab:t.saveLesson,\n      closeModal:()=>this.setState({modalOpen:false}),\n      stopProp:(e)=>e.stopPropagation(),\n      saveLesson:()=>{\n        const app=this.app;\n        const l={ id:Date.now()+\"-\"+Math.random().toString(36).slice(2,7), type:this.draft.type, date:this.draft.date, cost:Number(this.draft.cost||0), note:(this.draft.note||\"\").trim() };\n        this.setState({modalOpen:false});\n        this.mut(()=>{ app.lessons.push(l); const ps=app.stages.praxis; if(ps.status===\"todo\") ps.status=\"active\"; ps._open=true; });\n        this._toast(this.app.lang===\"de\"?\"Fahrstunde gespeichert ✓\":\"Lesson logged ✓\");\n      } };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
